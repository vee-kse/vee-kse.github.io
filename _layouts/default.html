<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
{% seo %}
<link rel="stylesheet" href="{{ '/assets/blog.css' | relative_url }}">
{% feed_meta %}
</head>
<body>
<header class="site-header"><div class="wrap">
  <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  <nav>
    <a href="{{ '/' | relative_url }}" {% unless page.url contains 'about' %}aria-current="page"{% endunless %}>Blog</a>
    <a href="{{ '/about/' | relative_url }}" {% if page.url contains 'about' %}aria-current="page"{% endif %}>About</a>
  </nav>
</div></header>
<main class="wrap">
{{ content }}
</main>
<footer class="site-footer"><div class="wrap">© {{ site.author }}. All rights reserved. All wrongs also reserved because I make a lot of those too.</div></footer>
<script src="{{ '/assets/blog.js' | relative_url }}"></script>
</body>
</html>
